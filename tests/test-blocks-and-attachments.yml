name: Test send-message with blocks and attachments
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-fake-token-for-testing"
          slack-channel: "C0000000000"
          slack-text: "Test message with blocks and attachments"
          slack-function: "send-message"
          slack-blocks: "[{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"Hello *world*\"}}]"
          slack-optional-attachments: "[{\"color\":\"#36a64f\",\"text\":\"Attachment text\"}]"
          slack-optional-blocks: "[{\"type\":\"divider\"}]"
          slack-optional-icon_url: "https://example.com/icon.png"
          slack-optional-link_names: "true"
          slack-optional-parse: "full"
      - name: Assert action failed gracefully with invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a fake token, Slack returns {"ok":false,"error":"invalid_auth"}
          # The action should call setFailed (not crash), so outcome should be 'failure'
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token (blocks and attachments params accepted)"
