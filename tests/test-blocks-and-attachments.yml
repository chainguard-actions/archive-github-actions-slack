name: Test send-message with blocks, attachments, and additional optional params
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-invalid-token-for-testing"
          slack-channel: "C0000000000"
          slack-text: "Test message with blocks and attachments"
          slack-function: "send-message"
          slack-blocks: "[{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"Hello from blocks\"}}]"
          slack-optional-attachments: "[{\"color\":\"#36a64f\",\"text\":\"Attachment text\"}]"
          slack-optional-blocks: "[{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"Optional block\"}}]"
          slack-optional-icon_url: "https://example.com/icon.png"
          slack-optional-link_names: "true"
          slack-optional-parse: "full"
          slack-optional-reply_broadcast: "false"
          slack-optional-thread_ts: "1234567890.123456"

      - name: Assert action failed due to invalid token (not input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With an invalid token, the Slack API returns an auth error.
          # The action should fail due to the API error, not due to input parsing.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token (blocks/attachments/optional params accepted)"
