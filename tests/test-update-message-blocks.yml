name: Test update-message with blocks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-fake-token-for-testing"
          slack-channel: "C0000000000"
          slack-function: "update-message"
          slack-update-message-ts: "1234567890.123456"
          slack-update-message-text: "Updated message text with blocks"
          slack-update-message-blocks: "[{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"Updated *block* content\"}}]"
      - name: Assert action failed gracefully with invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a fake token, Slack returns {"ok":false,"error":"invalid_auth"}
          # The action should call setFailed (not crash), so outcome should be 'failure'
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token (update-message-blocks param accepted)"
