name: Test update-message with blocks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: xoxb-fake-token-for-testing
          slack-channel: C0000000000
          slack-function: update-message
          slack-update-message-ts: "1234567890.123456"
          slack-update-message-text: "Updated message with blocks"
          slack-update-message-blocks: "[{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"Updated *block* content\"}}]"

      - name: Assert action ran and failed with invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          # With a fake token, Slack returns ok=false which causes the action to fail.
          # We assert the step ran (outcome is 'failure', not 'skipped' or empty).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid token"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (real token in env?)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
