name: Test send-message with parse and link_names options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-invalid-token-for-testing"
          slack-channel: "C0000000000"
          slack-text: "Test message with parse options"
          slack-function: "send-message"
          slack-optional-link_names: "true"
          slack-optional-parse: "full"

      - name: Assert step failed due to invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail with invalid token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: step correctly failed with invalid token when using link_names and parse"
