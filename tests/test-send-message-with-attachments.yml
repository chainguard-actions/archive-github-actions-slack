name: Test send-message with attachments and additional options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          slack-bot-user-oauth-access-token: "xoxb-fake-token-for-testing"
          slack-channel: "C0000000000"
          slack-text: "Hello from GitHub Actions test with attachments"
          slack-function: "send-message"
          slack-blocks: >-
            [{"type":"section","text":{"type":"mrkdwn","text":"*Block* content"}}]
          slack-optional-attachments: >-
            [{"color":"#36a64f","text":"Attachment text"}]
          slack-optional-icon_url: "https://example.com/icon.png"
          slack-optional-link_names: "true"
          slack-optional-parse: "full"
          slack-optional-reply_broadcast: "false"
          slack-optional-thread_ts: "1234567890.123456"
        continue-on-error: true
      - name: Assert action ran and failed gracefully with fake token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          # With a fake token, Slack returns ok:false and the action calls setFailed.
          # We expect outcome to be 'failure' (not a crash/timeout).
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — action may have crashed"
            exit 1
          fi
