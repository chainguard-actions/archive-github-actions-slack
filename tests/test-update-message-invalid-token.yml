name: Test update-message with invalid token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-invalid-token-for-testing"
          slack-channel: "C0000000000"
          slack-function: "update-message"
          slack-update-message-ts: "1234567890.123456"
          slack-update-message-text: "Updated message text"

      - name: Assert step failed due to invalid token on update-message
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail with invalid token on update-message, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: step correctly failed with invalid token on update-message"
