name: Test invalid slack-function
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-fake-token-for-testing"
          slack-channel: "C0000000000"
          slack-function: "invalid-unknown-function"
      - name: Assert action failed for invalid function
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid slack-function, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid slack-function"
