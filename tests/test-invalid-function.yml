name: Test invalid slack-function value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with invalid slack-function
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-invalid-token-for-testing"
          slack-channel: "test-channel"
          slack-text: "Hello from test"
          slack-function: "not-a-real-function"

      - name: Assert action failed due to invalid function
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid slack-function, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid slack-function value"
