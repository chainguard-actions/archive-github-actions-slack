name: Test invalid slack-function input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-invalid-token-for-testing"
          slack-channel: "C0000000000"
          slack-function: "invalid-function-name"

      - name: Assert step failed due to invalid function
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected step to fail with invalid slack-function, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: step correctly failed with invalid slack-function"
