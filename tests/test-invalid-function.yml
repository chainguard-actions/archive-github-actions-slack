name: Test invalid slack-function value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-invalid-token-for-testing"
          slack-channel: "CFAKE12345"
          slack-text: "Hello"
          slack-function: "unknown-function"

      - name: Assert action failed with unhandled function error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unknown slack-function, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with unknown slack-function value"
