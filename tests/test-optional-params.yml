name: Test send-message with optional parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-fake-token-for-testing"
          slack-channel: "C0000000000"
          slack-text: "Test message with optional params"
          slack-optional-username: "TestBot"
          slack-optional-icon_emoji: ":robot_face:"
          slack-optional-mrkdwn: "true"
          slack-optional-unfurl_links: "false"
          slack-optional-unfurl_media: "false"

      - name: Assert action failed with invalid token (expected, not due to optional params)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at API call (not at optional param parsing)"
