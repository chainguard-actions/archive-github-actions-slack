name: Test basic send-message with invalid token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-invalid-token-for-testing"
          slack-channel: "C0000000000"
          slack-text: "Test message from act"
          slack-function: "send-message"

      - name: Assert action ran and produced a result or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.slack-result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "slack-result: $RESULT"
          # The action should either succeed (unlikely with fake token) or fail
          # gracefully (not crash with an unhandled JS exception).
          # We accept both 'success' and 'failure' as valid outcomes —
          # what we do NOT accept is the action not running at all.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a deterministic outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
