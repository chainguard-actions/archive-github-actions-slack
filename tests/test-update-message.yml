name: Test update-message with invalid token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-fake-token-for-testing"
          slack-channel: "C0000000000"
          slack-function: "update-message"
          slack-update-message-ts: "1234567890.123456"
          slack-update-message-text: "Updated message text"

      - name: Assert action failed with invalid token on update-message (expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token on update-message, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given an invalid Slack token for update-message"
