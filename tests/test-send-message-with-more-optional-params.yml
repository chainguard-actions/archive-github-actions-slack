name: Test send-message with additional optional parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-invalid-token-for-testing"
          slack-channel: "CFAKE12345"
          slack-text: "Hello from test with more optional params"
          slack-function: "send-message"
          slack-optional-attachments: "[]"
          slack-optional-blocks: "[]"
          slack-optional-icon_url: "https://example.com/icon.png"
          slack-optional-link_names: "true"
          slack-optional-parse: "full"
          slack-optional-reply_broadcast: "false"
          slack-optional-thread_ts: "1234567890.123456"

      - name: Assert action ran and failed due to invalid auth
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid auth, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid auth token (additional optional params accepted)"
