name: Test send-message with additional optional parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        # The action accepts optional parameters and passes them to the Slack API.
        # With a fake token, Slack returns an auth error and the action fails.
        # We verify the action fails (auth error from Slack, not a parameter
        # validation error), confirming optional params are accepted correctly.
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-fake-token-for-testing"
          slack-channel: "C0000000000"
          slack-text: "Test message with more optional params"
          slack-optional-attachments: "[{\"fallback\": \"test attachment\", \"text\": \"attachment text\"}]"
          slack-optional-blocks: "[{\"type\": \"section\", \"text\": {\"type\": \"mrkdwn\", \"text\": \"block text\"}}]"
          slack-optional-icon_url: "https://example.com/icon.png"
          slack-optional-link_names: "true"
          slack-optional-parse: "full"
          slack-optional-reply_broadcast: "false"
          slack-optional-thread_ts: "1234567890.123456"

      - name: Assert action failed due to invalid auth (not parameter error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid auth token, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid auth (additional optional params were accepted)"
