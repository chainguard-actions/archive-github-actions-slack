name: Test send-message with thread_ts and reply_broadcast options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-invalid-token-for-testing"
          slack-channel: "C0000000000"
          slack-text: "Thread reply message"
          slack-function: "send-message"
          slack-optional-thread_ts: "1234567890.123456"
          slack-optional-reply_broadcast: "true"

      - name: Assert step failed due to invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail with invalid token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: step correctly failed with invalid token when using thread_ts and reply_broadcast"
