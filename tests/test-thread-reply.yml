name: Test send-message with thread reply parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-fake-token-for-testing"
          slack-channel: "C0000000000"
          slack-text: "Test reply in thread"
          slack-optional-thread_ts: "1234567890.123456"
          slack-optional-reply_broadcast: "true"

      - name: Assert action failed with invalid token (expected, not due to thread params)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at API call (not at thread param parsing)"
