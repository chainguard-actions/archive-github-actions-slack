name: Test send-message with optional parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-invalid-token-for-testing"
          slack-channel: "C0000000000"
          slack-text: "Hello from GitHub Actions!"
          slack-optional-username: "TestBot"
          slack-optional-icon_emoji: ":rocket:"
          slack-optional-mrkdwn: "true"

      - name: Assert step failed due to invalid token (not due to input parsing)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because of the invalid token (Slack API error),
          # not because of input parsing issues. Either failure outcome is acceptable
          # since we're using an invalid token.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected step to fail with invalid token, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: step correctly failed (invalid token causes Slack API error)"
