name: Test send-reaction with invalid auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          slack-bot-user-oauth-access-token: "xoxb-invalid-token-for-testing"
          slack-channel: "CFAKE12345"
          slack-function: "send-reaction"
          slack-emoji-name: "thumbsup"
          slack-message-timestamp: "1234567890.123456"

      - name: Assert action ran and failed due to invalid auth
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid auth, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid auth token (send-reaction function)"
